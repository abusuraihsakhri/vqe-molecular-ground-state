[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vqe-molecular-ground-state"
version = "2.0.0"
description = "VQE Variational Quantum Eigensolver Ground State Energy Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vqe-molecular-ground-state = "vqe_ground_state.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/vqe-molecular-ground-state"
Repository = "https://github.com/abusuraihsakhri/vqe-molecular-ground-state.git"
