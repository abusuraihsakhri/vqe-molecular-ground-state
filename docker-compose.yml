services:
  vqe-molecular-ground-state:
    build: .
    container_name: vqe-molecular-ground-state
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a strong audit key in the environment or .env file}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
